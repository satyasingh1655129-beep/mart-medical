<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pharmacy Final</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#f5f5f5;padding-bottom:80px}
@keyframes colorMove{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
#topShopBar{display:none;position:sticky;top:0;z-index:9999;background:linear-gradient(90deg,#ff0080,#ff8c00,#40e0d0,#0d47a1);background-size:300% 300%;animation:colorMove 4s infinite;color:white;padding:15px;text-align:center;font-weight:900;font-size:20px}
.top-row{display:flex;gap:8px;padding:10px;background:white;align-items:center;position:sticky;top:0;z-index:9998}
.top-row input{flex:1;padding:12px;border-radius:25px;border:2px solid #0d47a1;outline:none}
.top-row button{padding:12px;border-radius:25px;border:none;background:#0d47a1;color:white;font-weight:bold;white-space:nowrap}
.shop-row{display:flex;gap:8px;padding:8px;background:white;overflow-x:auto}
.shop-row button{padding:8px 14px;border-radius:20px;border:1px solid #0d47a1;background:white;color:#0d47a1;font-weight:bold;flex-shrink:0}
.product-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}
.product{background:white;padding:10px;border-radius:10px;text-align:center;border:1px solid #eee}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;justify-content:space-around;padding:12px 0;border-top:2px solid #0d47a1}
.bottom-nav a{text-decoration:none;color:#0d47a1;font-weight:bold}
.bottom-nav a.active{color:#ff0080}
#scanner{display:none;padding:10px;background:black;color:white;text-align:center}
</style>
</head>
<body>

<div id="topShopBar">🏪 <span id="shopNameTop"></span></div>

<!-- SEARCH + SCAN + SHOP NAME -->
<div class="top-row">
  <input id="searchBox" type="text" placeholder="Name / ID se search karo..." oninput="doSearch()">
  <button onclick="startScan()">📷 Scan</button>
  <button onclick="nearShop()">📍 Near Shop</button>
</div>
<div id="scanner">📷 Camera On - Bar Code Scan karo...</div>
<p id="locationMsg" style="text-align:center;font-size:12px;color:green;padding:4px"></p>

<div class="shop-row" id="shopList"></div>
<div id="productArea" class="product-grid"></div>

<div class="bottom-nav">
  <a href="index.html">🏠 HOME</a>
  <a href="pharmacy.html" class="active">💊 PHARMACY</a>
  <a href="hospital.html">🏥 HOSPITAL</a>
  <a href="cart.html">🛒 CART</a>
</div>

<script>
let shops=["Sharma Medical","NG Care Lucknow","City Pharma"];
let shopDiv=document.getElementById('shopList');
shops.forEach(name=>{
  let b=document.createElement('button'); b.innerText=name;
  b.onclick=()=>selectShop(name);
  shopDiv.appendChild(b);
});
function selectShop(name){
  sessionStorage.setItem('currentShop',name);
  document.getElementById('topShopBar').style.display='block';
  document.getElementById('shopNameTop').innerText=name;
}
let saved=sessionStorage.getItem('currentShop');
if(saved){document.getElementById('topShopBar').style.display='block';document.getElementById('shopNameTop').innerText=saved;}

// SEARCH BY NAME + ID
function doSearch(){
  let q=document.getElementById('searchBox').value.toLowerCase();
  let all=JSON.parse(localStorage.getItem('ng_products')||'[]');
  let filtered=all.filter(p=> (p.name||'').toLowerCase().includes(q) || (p.id||'').toLowerCase().includes(q));
  show(filtered);
}
function show(list){
  let div=document.getElementById('productArea'); div.innerHTML='';
  if(list.length==0){div.innerHTML='<p style="padding:20px">Product nahi mila</p>';return;}
  list.forEach(p=>{
    let profit=(p.mrp-p.kharida);
    let chhut=Math.round(profit*p.discount/100);
    let rate=Math.round(p.mrp-chhut);
    div.innerHTML+=`<div class="product"><small>ID: ${p.id||'--'}</small><br><b>${p.name}</b><br>MRP ₹${p.mrp}<br><b style="color:green">₹${rate}</b></div>`;
  });
}

// SCAN BAR CODE - SHOP NAME
function startScan(){
  let s=document.getElementById('scanner');
  s.style.display='block';
  s.innerHTML='📷 Scan ho raha hai... (Demo: 12345)';
  // Demo ke liye 2 sec baad ID search
  setTimeout(()=>{
    document.getElementById('searchBox').value='12345';
    doSearch();
    s.style.display='none';
    alert('Scan Success: ID 12345 - Shop: '+ (sessionStorage.getItem('currentShop')||'All Shop'));
  },2000);
}

// NEAR SHOP LOCATION
function nearShop(){
  let msg=document.getElementById('locationMsg');
  msg.innerText='Location le raha hai...';
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(()=>{
      msg.innerText='Aapke sabse paas Sharma Medical hai';
      selectShop('Sharma Medical');
    },()=>{msg.innerText='Location Allow karo';});
  } else {msg.innerText='Location support nahi hai';}
}

// Start
doSearch();
</script>
</body>
</html>
