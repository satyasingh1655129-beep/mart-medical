<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NGcare Login</title>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #1e88e5 0%, #a5d6a7 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 15px;
}
.main-card {
    background: #ffffff;
    width: 100%;
    max-width: 420px;
    border-radius: 22px;
    padding: 25px 20px 18px 20px;
    box-shadow: 0 12px 35px rgba(0,0,0,0.18);
    text-align: center;
}
.main-card h1 {
    margin: 0;
    font-size: 34px;
    font-weight: 900;
    letter-spacing: -0.5px;
    color: #0d47a1;
}
.main-card h1 .plus {
    color: #ff0000 !important;
    font-weight: 900;
}
.step-text {
    margin: 8px 0 22px 0;
    color: #212121;
    font-weight: 600;
    font-size: 17px;
}
.role-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
}
.role-box {
    border: 2.5px solid;
    border-radius: 18px;
    padding: 20px 10px 16px 10px;
    background: #fff;
    cursor: pointer;
    transition: all 0.2s ease;
}
.role-box:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.12);
}
.icon-circle {
    width: 78px;
    height: 78px;
    border-radius: 50%;
    margin: 0 auto 14px auto;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 38px;
}
.role-box p {
    margin: 0;
    font-weight: 700;
    font-size: 16px;
    color: #212121;
}

/* 4 Colours - Exact photo jaise */
.member { border-color: #00b761; }
.member .icon-circle { background: #c8e6c9; }

.pharmacist { border-color: #1976d2; }
.pharmacist .icon-circle { background: #bbdefb; }

.doctor { border-color: #ff8f00; }
.doctor .icon-circle { background: #ffe0b2; }

.service { border-color: #7c4dff; }
.service .icon-circle { background: #e1bee7; }

.footer-text {
    margin-top: 20px;
    font-size: 12px;
    color: #757575;
}
.role-box.selected {
    transform: scale(1.04);
    box-shadow: 0 0 0 4px #fff, 0 0 0 7px currentColor;
}

/* OTP Form */
#loginForm { margin-top: 20px; text-align: left; }
#loginForm input, #loginForm button {
    width: 100%;
    padding: 13px;
    margin-top: 10px;
    border-radius: 10px;
    border: 2px solid #ddd;
    font-size: 15px;
}
#loginForm button {
    background: #0d47a1;
    color: #fff;
    font-weight: bold;
    border: none;
    cursor: pointer;
}
.hidden { display: none; }
</style>
</head>
<body>

<div class="main-card">
    <h1><span class="plus">+</span>NGcare Login</h1>
    <div class="step-text">Step 1: Apna Role Select karo</div>

    <div class="role-grid">
        <div class="role-box member" onclick="selectRole('Member', this)">
            <div class="icon-circle">👤</div>
            <p>Member</p>
        </div>
        <div class="role-box pharmacist" onclick="selectRole('Pharmacist', this)">
            <div class="icon-circle">💊</div>
            <p>Pharmacist</p>
        </div>
        <div class="role-box doctor" onclick="selectRole('Doctor', this)">
            <div class="icon-circle">👨‍⚕️</div>
            <p>Doctor</p>
        </div>
        <div class="role-box service" onclick="selectRole('Service Team', this)">
            <div class="icon-circle">🔧</div>
            <p>Service Team</p>
        </div>
    </div>

    <div id="loginForm" class="hidden">
        <p id="roleText" style="text-align:center; font-weight:bold; color:#0d47a1;"></p>
        <input type="email" id="email" placeholder="Email daalo">
        <button onclick="sendOTP()">Send OTP</button>
        <input type="text" id="otpInput" placeholder="OTP daalo">
        <button onclick="verifyOTP()">Verify & Login</button>
        <p id="msg" style="text-align:center;"></p>
    </div>

    <div class="footer-text">You can change this later • Need help? Contact Support</div>
</div>

<script>
let generatedOtp = "";
let selectedRole = "";

function selectRole(role, element) {
    selectedRole = role;
    document.querySelectorAll('.role-box').forEach(box => box.classList.remove('selected'));
    element.classList.add('selected');
    document.getElementById('loginForm').classList.remove('hidden');
    document.getElementById('roleText').innerText = "Login as: " + role;
}

function sendOTP() {
    const email = document.getElementById('email').value;
    if (!email) {
        document.getElementById('msg').innerText = "Pehle Email daalo";
        document.getElementById('msg').style.color = "red";
        return;
    }
    generatedOtp = Math.floor(100000 + Math.random() * 900000).toString();
    alert("Demo OTP: " + generatedOtp + " | Role: " + selectedRole);
    document.getElementById('msg').innerText = "OTP bhej diya hai";
    document.getElementById('msg').style.color = "green";
}

function verifyOTP() {
    const entered = document.getElementById('otpInput').value;
    if (entered === generatedOtp) {
        document.getElementById('msg').innerText = "Login Success!";
        document.getElementById('msg').style.color = "green";
        setTimeout(() => { window.location.href = "index.html"; }, 1000);
    } else {
        document.getElementById('msg').innerText = "Galat OTP hai";
        document.getElementById('msg').style.color = "red";
    }
}
</script>

</body>
</html>
