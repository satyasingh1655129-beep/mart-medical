<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pharmacy</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#f5f5f5;padding-bottom:85px}
.header{background:#0d47a1;color:white;padding:14px;text-align:center;font-weight:bold}
.back-btn{position:fixed;top:10px;left:10px;z-index:99999;padding:8px 18px;border-radius:20px;border:none;background:#0d47a1;color:white;font-weight:bold}
.search-wrap{margin:50px 12px 0 12px;background:white;padding:8px 12px;border-radius:10px;display:flex;gap:8px;border:1px solid #ddd}
.search-wrap input{flex:1;border:none;outline:none;font-size:13px;height:28px}
.search-wrap label{font-size:13px;font-weight:bold;color:#0d47a1}
.list{padding:10px;display:flex;flex-direction:column;gap:10px}
.card{background:white;padding:12px;border-radius:10px;border:1px solid #eee}
.km{color:#0a9e00;font-weight:bold;font-size:12px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;justify-content:space-around;padding:12px 0;border-top:2px solid #0d47a1;z-index:9999}
.bottom-nav button{background:none;border:none;font-weight:bold;color:#0d47a1;font-size:14px}
.bottom-nav button.active{color:#ff0080}
</style>
</head>
<body>
<button class="back-btn" onclick="location.href='index.html'">← Back</button>
<div class="header">Pharmacy Near You</div>
<div class="search-wrap"><label>🔍 Scan:</label><input id="searchAll" placeholder="Name / ID / Near Shop..."></div>
<div id="medicalList" class="list"></div>
<div class="bottom-nav">
  <button onclick="location.href='index.html'">🏠 HOME</button>
  <button onclick="location.href='pharmacy.html'" class="active">💊 PHARMACY</button>
  <button onclick="location.href='hospital.html'">🏥 HOSPITAL</button>
  <button onclick="location.href='cart.html'">🛒 CART</button>
</div>
<script>
let medicals=JSON.parse(localStorage.getItem('medicals'))||[];
function render(list){list.sort((a,b)=>a.km-b.km);document.getElementById('medicalList').innerHTML=list.length==0?"<p style='text-align:center;color:#888;margin-top:20px;font-size:13px'>No Medical Found<br>Admin ke baad ayega</p>":list.map(m=>`<div class="card" onclick="location.href='medical-detail.html?id=${m.id}'"><b>${m.name} [${m.id}]</b><br><span class="km">📍 ${m.km} KM Near</span> - ${m.address}</div>`).join('')}
document.getElementById('searchAll').addEventListener('input',function(){let v=this.value.toLowerCase();render(medicals.filter(m=>m.name.toLowerCase().includes(v)||m.id.toLowerCase().includes(v)))});render(medicals);
</script>
</body>
</html>
