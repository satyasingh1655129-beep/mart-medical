<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:sans-serif;margin:0;padding:0}
.header{display:flex;justify-content:space-between;align-items:center;padding:10px;border:1px solid #000;margin:5px;border-radius:8px}
button{border:1px solid #000;padding:6px 12px;border-radius:5px;background:white;cursor:pointer}
.view{display:none;padding:10px}
.view.active{display:block}
.list-item{display:flex;justify-content:space-between;align-items:center;padding:10px;border-bottom:1px solid #ddd}
.box{border:1px solid #000;padding:15px;border-radius:10px;margin-top:10px}
.token-box{margin-top:15px;padding:15px;background:#e3f2fd;border-radius:10px;text-align:center;border:1px solid #90caf9}
</style>
</head>
<body>

<div class="header">
  <b>🏥 Hospital</b>
  <div>
    <button onclick="handleListClick()">List</button>
    <button onclick="startScanner()">📷</button>
  </div>
</div>

<!-- 1st Click pe bahar list -->
<div id="outsideList" style="display:none;border:1px solid #000;margin:5px 5px;border-radius:8px;max-height:200px;overflow:auto"></div>

<!-- Main View -->
<div id="mainView" class="view active">
  <p style="text-align:center;color:#666">Scanner se Hospital Add karo</p>
</div>

<!-- Saved Full List View -->
<div id="savedList" class="view">
  <h3>Hospital List (Save Hai)</h3>
  <div id="savedHospitals"></div>
  <button onclick="showView('mainView')" style="margin-top:10px">← Back</button>
</div>

<!-- Detail View + OPD Token -->
<div id="detailView" class="view">
  <div class="box">
    <h3 id="dName">Hospital Name</h3>
    <div id="dImageBox" style="border:1px solid #000;height:100px;display:flex;align-items:center;justify-content:center;margin:10px 0;background:#fafafa">Hospital Image (Doctor Dashboard se ayegi)</div>
    <div id="doctorList" style="font-size:13px;color:#555">All Doctor List - Doctor Dashboard se ayegi</div>
    
    <div class="token-box">
      <b>OPD TOKEN - Sab logo ke liye</b><br>
      <small>Total: <span id="totalToken">50</span> | Bache: <span id="leftToken">50</span></small>
      <div id="myTokenNo" style="font-size:22px;font-weight:bold;margin:10px 0">Token No: -</div>
      <button id="tokenBtn" onclick="takeToken()" style="background:#2e7d32;color:white;padding:10px 30px;font-weight:bold;border:none">OPD Token Lo</button>
    </div>
  </div>
  <button onclick="showView('savedList')" style="margin-top:10px">← Back to List</button>
</div>

<script>
let saved = JSON.parse(localStorage.getItem('hospitals')||"[]");
let currentHospitalId = "";
let listClickCount = 0;

// View Switch
function showView(id){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// Scanner - Demo ke liye prompt se (aapka scanner code yahan lagega)
function startScanner(){
  let name = prompt("Hospital ka Naam likho (Scanner Demo):");
  if(!name) return;
  let obj = {id:Date.now().toString(), name:name, maxToken:50, doctors:[]};
  saved.push(obj);
  localStorage.setItem('hospitals', JSON.stringify(saved));
  alert(name+" Add ho gaya!");
  renderSaved(saved);
}

// List Click Logic
function handleListClick(){
  listClickCount++;
  if(listClickCount==1){
    let box=document.getElementById('outsideList');
    box.style.display='block';
    if(saved.length==0){ box.innerHTML="<p style='padding:10px'>Koi hospital add nahi hai</p>"; return;}
    box.innerHTML=saved.map((h,i)=>`<div onclick="openDetail('${h.id}')" style="padding:10px;border-bottom:1px solid #ddd;background:#f9f9f9;cursor:pointer">${i+1}- ${h.name}</div>`).join('');
  }else{
    document.getElementById('outsideList').style.display='none';
    renderSaved(saved);
    showView('savedList');
    listClickCount=0;
  }
}

// Render Full List with Delete
function renderSaved(list){
  document.getElementById('savedHospitals').innerHTML = list.map((h,i)=>`
    <div class="list-item">
      <span onclick="openDetail('${h.id}')" style="flex:1;cursor:pointer">${i+1}- ${h.name}</span>
      <button onclick="deleteHospital('${h.id}')" style="background:red;color:white;padding:4px 10px;font-size:12px">✕ Delete</button>
    </div>
  `).join('') || "<p>No Hospital</p>";
}

function deleteHospital(id){
  if(!confirm("Delete karna hai?")) return;
  saved = saved.filter(x=>x.id!=id);
  localStorage.setItem('hospitals', JSON.stringify(saved));
  localStorage.removeItem('tokens_'+id);
  localStorage.removeItem('myToken_'+id);
  renderSaved(saved);
  document.getElementById('outsideList').style.display='none';
  listClickCount=0;
}

// Detail + OPD Token
function openDetail(id){
  currentHospitalId=id;
  let h=saved.find(x=>x.id==id);
  document.getElementById('dName').innerText=h.name;
  document.getElementById('outsideList').style.display='none';
  
  let tokens=JSON.parse(localStorage.getItem('tokens_'+id)||"[]");
  let myToken=localStorage.getItem('myToken_'+id);
  document.getElementById('totalToken').innerText=h.maxToken||50;
  document.getElementById('leftToken').innerText=(h.maxToken||50)-tokens.length;

  if(myToken){
    document.getElementById('myTokenNo').innerText="Aapka Token No: "+myToken;
    document.getElementById('tokenBtn').innerText="Token Mil Gaya ✓";
    document.getElementById('tokenBtn').disabled=true;
    document.getElementById('tokenBtn').style.background="#999";
  }else{
    document.getElementById('myTokenNo').innerText="Token No: -";
    document.getElementById('tokenBtn').innerText="OPD Token Lo";
    document.getElementById('tokenBtn').disabled=false;
    document.getElementById('tokenBtn').style.background="#2e7d32";
  }
  showView('detailView');
}

function takeToken(){
  let id=currentHospitalId;
  let h=saved.find(x=>x.id==id);
  let max=h.maxToken||50;
  let tokens=JSON.parse(localStorage.getItem('tokens_'+id)||"[]");
  if(tokens.length>=max){ alert("Token Khatam!"); return;}
  let newNo=tokens.length+1;
  tokens.push({no:newNo,time:new Date().toLocaleTimeString()});
  localStorage.setItem('tokens_'+id,JSON.stringify(tokens));
  localStorage.setItem('myToken_'+id,newNo);
  document.getElementById('myTokenNo').innerText="Aapka Token No: "+newNo;
  document.getElementById('leftToken').innerText=max-tokens.length;
  document.getElementById('tokenBtn').innerText="Token Mil Gaya ✓";
  document.getElementById('tokenBtn').disabled=true;
  alert("OPD Token No "+newNo+" Mil Gaya!");
}

// Start me render
renderSaved(saved);
</script>
</body>
</html>
