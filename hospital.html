<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hospital</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
body{font-family:Arial;margin:0;background:white;padding-bottom:70px}
.header{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border:1px solid #000;margin:6px;border-radius:6px;background:white}
.header b{font-size:14px}
.header button{border:1px solid #000;padding:5px 10px;border-radius:4px;background:white;font-size:12px}
.view{display:none;padding:8px}
.view.active{display:block}
#outsideList{margin:0 6px;border:1px solid #000;border-radius:6px;display:none;max-height:200px;overflow:auto;background:white}
.list-item{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-bottom:1px solid #ddd;font-size:14px}
.box{border:1px solid #000;padding:12px;border-radius:6px;background:white}
.token-box{margin-top:12px;padding:12px;background:#e8f4ff;border-radius:6px;text-align:center;border:1px solid #000}
#reader{width:100%;border:1px solid #000;border-radius:6px}
.fix-bottom{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #000;padding:6px 8px;display:flex;gap:6px;z-index:999}
.fix-bottom input{flex:1;border:1px solid #000;border-radius:4px;padding:8px;font-size:13px}
.fix-bottom button{border:1px solid #000;border-radius:4px;padding:8px 12px;background:white;font-size:12px}
</style>
</head>
<body>

<div class="header">
  <span>🛡️ Hospital</span>
  <div>
    <button onclick="handleListClick()">List</button>
    <button onclick="startScanner()">📷</button>
  </div>
</div>

<div id="outsideList"></div>

<div id="scannerView" class="view">
  <div id="reader"></div>
  <button onclick="stopScanner()" style="width:100%;margin-top:8px;background:#ff4444;color:white">Close</button>
</div>

<div id="mainView" class="view active">
  <p style="text-align:center;margin-top:60px;color:#666;font-size:14px">Scanner se Hospital Add karo</p>
</div>

<div id="savedList" class="view">
  <div id="savedHospitals"></div>
  <button onclick="showView('mainView')" style="margin-top:10px">← Back</button>
</div>

<div id="detailView" class="view">
  <div class="box">
    <div style="font-weight:bold" id="dName">Hospital Name</div>
    <div id="dImageBox" style="border:1px solid #000;height:70px;margin:8px 0;display:flex;align-items:center;justify-content:center;font-size:12px">Hospital Image</div>
    <div id="doctorList" style="font-size:12px;color:#555">All Doctor</div>
    <div class="token-box">
      <div style="font-size:13px;font-weight:bold">OPD TOKEN - Sab logo ke liye</div>
      <div style="font-size:11px;margin:4px 0">Total: <span id="totalToken">50</span> | Bache: <span id="leftToken">50</span></div>
      <div id="myTokenNo" style="font-size:18px;font-weight:bold;margin:8px 0">Token No: -</div>
      <button id="tokenBtn" onclick="takeToken()" style="background:#2e7d32;color:white;width:100%;padding:8px">OPD Token Lo</button>
    </div>
  </div>
  <button onclick="showView('savedList')" style="margin-top:10px">← Back</button>
</div>

<!-- FIX BOTTOM SEARCH BAR - ID / Hospital Search -->
<div class="fix-bottom">
  <input id="searchInput" onkeyup="searchHospital()" placeholder="ID ya Hospital Search...">
  <button onclick="searchHospital()">Search</button>
</div>

<script>
let saved=JSON.parse(localStorage.getItem('hospitals')||"[]");
let currentHospitalId="";
let listClickCount=0;
let html5Qrcode;
function showView(id){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById(id).classList.add('active');document.getElementById('outsideList').style.display='none';}
function startScanner(){showView('scannerView');html5Qrcode=new Html5Qrcode("reader");html5Qrcode.start({facingMode:"environment"},{fps:10,qrbox:200},(t)=>{stopScanner();if(saved.find(x=>x.name==t)){alert("Pehle se add hai");return;}saved.push({id:Date.now().toString(),name:t,maxToken:50});localStorage.setItem('hospitals',JSON.stringify(saved));renderSaved(saved);alert(t+" Add ho gaya!");showView('mainView');},()=>{});}
function stopScanner(){if(html5Qrcode)html5Qrcode.stop();showView('mainView');}
function handleListClick(){listClickCount++;if(listClickCount==1){let b=document.getElementById('outsideList');b.style.display='block';b.innerHTML=saved.length?saved.map((h,i)=>`<div onclick="openDetail('${h.id}')" style="padding:8px;border-bottom:1px solid #ddd">${i+1}- ${h.name}</div>`).join(''):"<p style='padding:8px;font-size:12px'>Koi hospital nahi</p>";}else{renderSaved(saved);showView('savedList');listClickCount=0;}}
function renderSaved(list){document.getElementById('savedHospitals').innerHTML=list.map((h,i)=>`<div class="list-item"><span onclick="openDetail('${h.id}')" style="flex:1">${i+1}- ${h.name}</span><button onclick="deleteHospital('${h.id}')" style="background:red;color:white;padding:3px 8px;font-size:11px">✕</button></div>`).join('')||"<p style='font-size:12px'>No Hospital</p>";}
function deleteHospital(id){if(!confirm("Delete?"))return;saved=saved.filter(x=>x.id!=id);localStorage.setItem('hospitals',JSON.stringify(saved));renderSaved(saved);document.getElementById('outsideList').style.display='none';listClickCount=0;}
function openDetail(id){currentHospitalId=id;let h=saved.find(x=>x.id==id);document.getElementById('dName').innerText=h.name;let tokens=JSON.parse(localStorage.getItem('tokens_'+id)||"[]");let my=localStorage.getItem('myToken_'+id);document.getElementById('totalToken').innerText=50;document.getElementById('leftToken').innerText=50-tokens.length;if(my){document.getElementById('myTokenNo').innerText="Aapka Token No: "+my;document.getElementById('tokenBtn').innerText="Token Mil Gaya ✓";document.getElementById('tokenBtn').disabled=true;}else{document.getElementById('myTokenNo').innerText="Token No: -";document.getElementById('tokenBtn').innerText="OPD Token Lo";document.getElementById('tokenBtn').disabled=false;}showView('detailView');}
function takeToken(){let id=currentHospitalId;let tokens=JSON.parse(localStorage.getItem('tokens_'+id)||"[]");if(tokens.length>=50){alert("Token Khatam");return;}let n=tokens.length+1;tokens.push({no:n});localStorage.setItem('tokens_'+id,JSON.stringify(tokens));localStorage.setItem('myToken_'+id,n);openDetail(id);}
function searchHospital(){let q=document.getElementById('searchInput').value.toLowerCase();let b=document.getElementById('outsideList');if(!q){b.style.display='none';renderSaved(saved);return;}let f=saved.filter(h=>h.name.toLowerCase().includes(q)||h.id.includes(q));b.style.display='block';b.innerHTML=f.length?f.map(h=>`<div onclick="openDetail('${h.id}')" style="padding:8px;border-bottom:1px solid #ddd;background:#fff9c4">${h.name}</div>`).join(''):"<p style='padding:8px'>Nahi mila</p>";renderSaved(f);}
renderSaved(saved);
</script>
</body>
</html>
