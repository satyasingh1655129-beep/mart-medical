<!DOCTYPE html>
<html class="light" lang="hi">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>PharmaCare Login</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<style> 
  body { font-family: 'Inter', sans-serif; } 
  .role-btn.active { border-color: #0d631b; background-color: #f0fdf4; }
</style>
</head>
<body class="bg-[#f7fbf0] text-[#1a1c19] min-h-screen flex flex-col justify-center items-center p-6">
<div class="w-full max-w-md bg-white rounded-xl shadow-sm border border-gray-200 p-10">

<!-- Header -->
<div class="text-center mb-8">
  <h1 class="text-3xl font-bold text-[#0d631b] mb-1">PharmaCare</h1>
  <p class="text-gray-600">Secure System Access</p>
</div>

<!-- Role Selection -->
<div class="mb-6">
  <h2 class="text-sm font-semibold mb-3">Select Your Role</h2>
  <div class="grid grid-cols-2 gap-3" id="roleBox">
    <button type="button" data-role="Member" class="role-btn flex flex-col items-center p-4 rounded-lg border-2 border-gray-300">
      <span class="material-symbols-outlined mb-2 bg-blue-100 p-2 rounded-full text-blue-600">person</span>
      <span class="text-sm font-medium">Member</span>
    </button>
    <button type="button" data-role="Pharmacist" class="role-btn active flex flex-col items-center p-4 rounded-lg border-2">
      <span class="material-symbols-outlined mb-2 bg-green-100 p-2 rounded-full text-[#0d631b]">local_pharmacy</span>
      <span class="text-sm font-medium text-[#0d631b]">Pharmacist</span>
    </button>
    <button type="button" data-role="Doctor" class="role-btn flex-col items-center p-4 rounded-lg border-2 border-gray-300">
      <span class="material-symbols-outlined mb-2 bg-teal-100 p-2 rounded-full text-teal-600">stethoscope</span>
      <span class="text-sm font-medium">Doctor</span>
    </button>
    <button type="button" data-role="Service" class="role-btn flex flex-col items-center p-4 rounded-lg border-2 border-gray-300">
      <span class="material-symbols-outlined mb-2 bg-yellow-100 p-2 rounded-full text-yellow-600">support_agent</span>
      <span class="text-sm font-medium">Service Team</span>
    </button>
  </div>
</div>

<!-- Step 1: Email -->
<div id="step1">
  <label class="block text-sm font-semibold mb-1">Email ID</label>
  <input id="email" class="w-full p-3 border-gray-300 rounded-lg mb-3 focus:border-[#0d631b]" placeholder="admin@pehledawai.com" type="email" required/>
  <button onclick="sendOTP()" type="button" class="w-full bg-[#0d631b] hover:bg-[#005312] text-white font-semibold py-3 rounded-lg">
    Send OTP
  </button>
</div>

<!-- Step 2: OTP - shuru me band -->
<div id="step2" style="display:none;">
  <p class="text-sm text-gray-600 mb-3">OTP bhej diya gaya hai <b id="showEmail" class="text-[#0d631b]"></b> par</p>
  
  <label class="block text-sm font-semibold mb-2">Enter 6 Digit OTP</label>
  <div class="flex gap-2 mb-4 justify-center">
    <input class="otp-box w-12 h-12 text-center border border-gray-300 rounded-lg text-xl focus:border-[#0d631b]" maxlength="1" type="text">
    <input class="otp-box w-12 h-12 text-center border border-gray-300 rounded-lg text-xl focus:border-[#0d631b]" maxlength="1" type="text">
    <input class="otp-box w-12 h-12 text-center border border-gray-300 rounded-lg text-xl focus:border-[#0d631b]" maxlength="1" type="text">
    <input class="otp-box w-12 h-12 text-center border-gray-300 rounded-lg text-xl focus:border-[#0d631b]" maxlength="1" type="text">
    <input class="otp-box w-12 h-12 text-center border border-gray-300 rounded-lg text-xl focus:border-[#0d631b]" maxlength="1" type="text">
    <input class="otp-box w-12 h-12 text-center border border-gray-300 rounded-lg text-xl focus:border-[#0d631b]" maxlength="1" type="text">
  </div>

  <button onclick="verifyOTP()" type="button" class="w-full bg-[#0d631b] hover:bg-[#005312] text-white font-semibold py-3 rounded-lg flex items-center justify-center gap-2">
    <span class="material-symbols-outlined">lock_open</span>
    Verify & Login
  </button>
  <button onclick="sendOTP()" type="button" class="w-full text-[#0d631b] text-sm mt-3 font-semibold">Resend Code</button>
</div>

<p id="msg" class="text-center mt-4 font-medium"></p>

<!-- Trust -->
<div class="mt-8 pt-4 border-t border-gray-200 flex justify-center items-center gap-4 text-gray-500 text-xs">
  <span>HIPAA Compliant</span> | <span>Encrypted Data</span>
</div>
</div>

<script>
  let generatedOTP = ""; 
  let userEmail = "";
  let selectedRole = "Pharmacist";

  // Role Select
  document.querySelectorAll('.role-btn').forEach(btn=>{
    btn.onclick = () => {
      document.querySelectorAll('.role-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      selectedRole = btn.dataset.role;
    }
  })

  // OTP Bhejna
  function sendOTP() {
    userEmail = document.getElementById('email').value;
    if(userEmail == "") { alert("Pehle Email ID dalo"); return; }

    generatedOTP = Math.floor(100000 + Math.random() * 900000);
    
    // FREE TEST: OTP Alert me dikh jayega
    alert(`TEST OTP: ${generatedOTP} \n\nRole: ${selectedRole}\n\nAsli me ye Email par jayega`);

    document.getElementById('showEmail').innerText = userEmail;
    document.getElementById('step1').style.display = "none";
    document.getElementById('step2').style.display = "block";
    document.getElementById('msg').innerText = "";
  }

  // OTP Verify
  function verifyOTP() {
    let enteredOTP = "";
    document.querySelectorAll('.otp-box').forEach(box => enteredOTP += box.value);

    if(enteredOTP == generatedOTP) {
      document.getElementById('msg').innerHTML = `✅ Login Successful! Welcome ${selectedRole}`;
      document.getElementById('msg').className = "text-center text-green-600 mt-4 font-medium";
      
      // 1.5 sec baad MART wali site par
      setTimeout(()=>{ window.location.href = "index.html" }, 1500);

    } else {
      document.getElementById('msg').innerHTML = "❌ Galat OTP. Dubara try karo";
      document.getElementById('msg').className = "text-center text-red-600 mt-4 font-medium";
    }
  }
if(enteredOtp === generatedOtp){
    document.getElementById('msg').innerHTML = "✅ Login Successful! 2 sec me khul rahi hai";
    document.getElementById('msg').className = "text-center text-green-600 mt-4 font-medium";
    
    // 1.5 sec baad original site kholega
    setTimeout(()=>{ 
        window.location.href = "index.html"  
    }, 1500);

} else {
  // OTP box auto next
  document.querySelectorAll('.otp-box').forEach((box, i, arr) => {
    box.oninput = () => { 
      if(box.value.length == 1 && i < 5) arr[i+1].focus() 
    }
    box.onkeydown = (e) => {
      if(e.key == "Backspace" && !box.value && i > 0) arr[i-1].focus()
    }
  })
</script>
</body>
</html>
