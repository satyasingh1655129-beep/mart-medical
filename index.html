<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NG Care</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#f5f5f5;padding-bottom:85px}
.header{background:#0d47a1;color:white;padding:14px;text-align:center;font-weight:bold;font-size:18px}
#banner{width:100%;height:150px;background:#ddd;display:flex;align-items:center;justify-content:center;font-size:20px}
.search-bar{padding:12px;background:white;display:flex;gap:8px;margin:10px 0}
.search-bar input{flex:1;padding:12px 16px;border-radius:25px;border:1px solid #0d47a1;outline:none}
.search-bar button{padding:12px 20px;border-radius:25px;border:none;background:#0d47a1;color:white}
.box{margin:12px;background:white;padding:14px;border-radius:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.product{border:1px solid #eee;padding:10px;border-radius:10px;text-align:center}
.bottom{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;justify-content:space-around;padding:12px 0;border-top:1px solid #ccc;z-index:999}
.bottom button{border:none;background:#0d47a1;color:white;padding:10px 14px;border-radius:20px;font-size:13px;font-weight:bold}
</style>
</head>
<body>

<div class="header">NG Care</div>
<div id="banner">Banner</div>

<div class="search-bar" id="homeTop">
  <input id="searchInput" placeholder="Search product..." onkeyup="searchProduct()">
  <button onclick="searchProduct()">🔍</button>
</div>

<div id="homeSections">
  <div class="box" id="pharmacySection">
    <h3>💊 Pharmacy - New Product</h3>
    <div id="newList" class="grid"><p>Admin se product add karo</p></div>
  </div>

  <div class="box" id="hospitalSection">
    <h3>🏥 Hospital</h3>
    <div id="hospitalList" class="grid"><p>Hospital products</p></div>
  </div>

  <div class="box" id="trendSection">
    <h3>🔥 Trending Product</h3>
    <div id="trendList" class="grid"><p>Khali</p></div>
  </div>

  <div class="box" id="cartSection">
    <h3>🛒 Cart</h3>
    <div id="cartList"><p>Cart khali hai</p></div>
  </div>
</div>

<!-- 4 FIX BUTTON -->
<div class="bottom">
  <button onclick="goFix('homeTop')">🏠 HOME</button>
  <button onclick="goFix('pharmacySection')">💊 PHARMACY</button>
  <button onclick="goFix('hospitalSection')">🏥 HOSPITAL</button>
  <button onclick="goFix('cartSection')">🛒 CART</button>
</div>

<script>
let products = JSON.parse(localStorage.getItem('ng_products') || '[]');

function loadProducts(){
  let n=document.getElementById('newList');
  let t=document.getElementById('trendList');
  if(products.length===0) return;
  n.innerHTML=''; t.innerHTML='';
  products.forEach(p=>{
    let html=`<div class="product"><p style="font-weight:bold">${p.name}</p><small>${p.cat}</small><br><b>₹${p.price}</b></div>`;
    if(p.trending) t.innerHTML+=html; else n.innerHTML+=html;
  });
}
loadProducts();

function goFix(id){
  document.getElementById(id).scrollIntoView({behavior:'smooth',block:'start'});
}

function searchProduct(){
  let q=document.getElementById('searchInput').value.toLowerCase().trim();
  let n=document.getElementById('newList');
  if(!q){ loadProducts(); return; }
  let f=products.filter(p=>p.name.toLowerCase().includes(q));
  n.innerHTML='';
  if(f.length===0) n.innerHTML='<p>Nahi mila</p>';
  else f.forEach(p=>{ n.innerHTML+=`<div class="product"><p>${p.name}</p><b>₹${p.price}</b></div>`; });
}
</script>
</body>
</html>
