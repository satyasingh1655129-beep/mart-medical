<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hospital</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#f5f5f5;padding-bottom:85px;font-size:14px}
.header{background:#0d47a1;color:white;padding:14px;text-align:center;font-weight:bold;font-size:15px;position:relative}
.back-btn{position:fixed;top:8px;left:8px;z-index:99999;padding:6px 14px;border-radius:20px;border:none;background:#0d47a1;color:white;font-weight:bold;font-size:12px}
.search-wrap{margin:45px 10px 6px 10px;background:white;padding:7px 10px;border-radius:8px;display:flex;align-items:center;gap:6px;border:1px solid #ddd;height:38px}
.search-wrap input{flex:1;border:none;outline:none;font-size:13px}
.action-row{margin:0 10px;display:flex;gap:6px}
.action-row button{flex:1;padding:7px;border:1px solid #0d47a1;background:white;color:#0d47a1;border-radius:6px;font-weight:bold}
#reader{width:92%;margin:8px auto;display:none;border-radius:8px;border:1px solid #0d47a1;overflow:hidden}
#scanResult{margin:8px 10px;display:none;background:white;padding:10px;border-radius:8px;border:1px solid #2e7d32;align-items:center;justify-content:space-between}
.list{padding:8px;display:flex;flex-direction:column;gap:8px}
.card{background:white;padding:10px;border-radius:8px;border:1px solid #eee;display:flex;justify-content:space-between;align-items:center}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;justify-content:space-around;padding:5px 0;border-top:2px solid #0d47a1}
.bottom-nav button{background:none;border:none;color:#0d47a1;font-weight:bold;font-size:9px;flex:1;padding:6px 2px;border-radius:25px}
.bottom-nav button span{font-size:18px;display:block}
.bottom-nav button.active{background:#0d47a1;color:white}
</style>
</head>
<body>
<button class="back-btn" onclick="handleBack()">← Back</button>
<div class="header">Hospital</div>
<div class="search-wrap">🔍 <input id="searchAll" placeholder="Search..."></div>
<div class="action-row"><button onclick="startScanner()">📷 Scanner</button></div>
<div id="reader"></div>

<div id="scanResult">
  <div><b id="scanName"></b><br><small id="scanId"></small></div>
  <button onclick="saveScanned()" style="background:#2e7d32;color:white;border:none;padding:8px 14px;border-radius:15px;font-weight:bold">💾 SAVE</button>
</div>

<div id="hospitalList" class="list"></div>

<div class="bottom-nav">
<button onclick="location.replace('index.html')"><span>🏠</span>HOME</button>
<button onclick="location.replace('pharmacy.html')"><span>💊</span>PHARMACY</button>
<button class="active"><span>🏥</span>HOSPITAL</button>
<button onclick="location.replace('cart.html')"><span>🛒</span>CART</button>
</div>

<script>
let hospitals=JSON.parse(localStorage.getItem('hospitals'))||[];
let html5QrCode=null,scannerOn=false;
let tempScan=null;

function handleBack(){
 if(scannerOn){closeScanner();return}
 if(document.getElementById('scanResult').style.display=='flex'){document.getElementById('scanResult').style.display='none';return}
 if(document.getElementById('searchAll').value!=""){document.getElementById('searchAll').value="";render(hospitals);return}
 location.replace('index.html');
}

function render(list){
  let div=document.getElementById('hospitalList');
  if(list.length==0){div.innerHTML="<p style='text-align:center;color:#888;margin-top:15px'>No Data</p>";return}
  div.innerHTML=list.map((m,i)=>`
    <div class="card">
      <div onclick="searchThisHospital('${m.id}')" style="flex:1">
        <b>${m.name} [${m.id}]</b><br>${m.address||''}<br>
        <small style="color:#0d47a1">👉 Click karke search karo</small>
      </div>
      <button onclick="deleteHospital(${hospitals.indexOf(m)})" style="background:#c62828;color:white;border:none;padding:5px 10px;border-radius:6px;font-size:11px">🗑 DELETE</button>
    </div>
  `).join('');
}

function searchThisHospital(idOrName){
  // Click karte hi usi naam ka hospital search ho jaye
  document.getElementById('searchAll').value = idOrName;
  let v = idOrName.toLowerCase();
  let filtered = hospitals.filter(m=> m.id.toLowerCase()==v || m.name.toLowerCase().includes(v));
  // Agar filter me nahi to pura list me se search
  if(filtered.length==0) filtered = hospitals.filter(m=> m.id.toLowerCase().includes(v) || m.name.toLowerCase().includes(v));
  document.getElementById('hospitalList').innerHTML = filtered.map((m,i)=>`
    <div class="card" style="border:2px solid #0d47a1;background:#e3f2fd">
      <div style="flex:1"><b>🏥 ${m.name} [${m.id}]</b><br>${m.address||''}<br><small>Ye hospital search hua hai</small></div>
      <button onclick="render(hospitals)" style="background:#0d47a1;color:white;border:none;padding:5px 10px;border-radius:6px;font-size:11px">Back List</button>
    </div>
  `).join('') + '<div style="margin-top:8px">'+filtered.length+' result mile</div>';
  window.scrollTo({top:0,behavior:'smooth'});
}

function deleteHospital(idx){
  if(!confirm('Delete karna hai?')) return;
  hospitals.splice(idx,1);
  localStorage.setItem('hospitals',JSON.stringify(hospitals));
  render(hospitals);
}

function startScanner(){
  document.getElementById('reader').style.display='block';
  document.getElementById('scanResult').style.display='none';
  scannerOn=true; 
  html5QrCode=new Html5Qrcode("reader"); 
  html5QrCode.start({facingMode:"environment"},{fps:10,qrbox:200},d=>{
    closeScanner();
    tempScan = {id:d, name:"Medical - "+d, address:"Hospital"};
    document.getElementById('scanName').innerText = tempScan.name;
    document.getElementById('scanId').innerText = tempScan.id;
    document.getElementById('scanResult').style.display='flex';
  },()=>{})
}

function closeScanner(){
  if(html5QrCode){try{html5QrCode.stop()}catch(e){} html5QrCode=null} 
  document.getElementById('reader').style.display='none'; 
  scannerOn=false
}

function saveScanned(){
  if(!tempScan) return;
  hospitals.push(tempScan);
  localStorage.setItem('hospitals', JSON.stringify(hospitals));
  document.getElementById('scanResult').style.display='none';
  tempScan=null;
  render(hospitals);
}

document.getElementById('searchAll').addEventListener('input',function(){
  let v=this.value.toLowerCase(); 
  if(!v){render(hospitals);return}
  render(hospitals.filter(m=>m.name.toLowerCase().includes(v)||m.id.toLowerCase().includes(v)))
});

render(hospitals);
</script>
</body>
</html>
