<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NG Care</title>
<link rel="stylesheet" href="design.css">
</head>
<body>
<h2 style="text-align:center;background:#0d47a1;color:white;padding:12px">NG Care - North Medical</h2>

<div style="padding:12px">
  <input id="searchInput" placeholder="Search..." style="width:80%;padding:10px;border-radius:20px;border:1px solid #0d47a1">
  <button onclick="searchData()" style="padding:10px 15px;border-radius:20px;background:#0d47a1;color:white;border:none">🔍</button>
</div>

<div id="main" style="padding:12px"></div>

<script src="design.js"></script>
<script>
let products = JSON.parse(localStorage.getItem('ng_products') || '[]');
let mainDiv = document.getElementById('main');
if(products.length==0){
  mainDiv.innerHTML = '<p>Admin se product add karo</p>';
} else {
  products.forEach(p=>{
    mainDiv.innerHTML += `<div style="border:1px solid #ddd;padding:10px;margin:5px;border-radius:8px"><b>${p.name}</b><br>${p.cat} - ₹${p.price}</div>`;
  });
}
function searchData(){
  let q = document.getElementById('searchInput').value.toLowerCase();
  let f = products.filter(p=>p.name.toLowerCase().includes(q) || p.cat.toLowerCase().includes(q));
  mainDiv.innerHTML = f.map(p=>`<div style="border:1px solid #ddd;padding:10px;margin:5px;border-radius:8px">${p.name}</div>`).join('') || '<p>Nahi mila</p>';
}
</script>
</body>
</html>
