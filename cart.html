<!DOCTYPE html>
<html lang="hi">
<head>

</div>

<div class="hori-fix">
  <button class="btn-bag" onclick="filterCart('bag')">👜 Bag</button>
  <button class="btn-med" onclick="filterCart('medical')">💊 Medical</button>

</div>

<div id="cartArea" class="cart-grid"></div>

<div class="bottom-nav">

  <button onclick="location.replace('pharmacy.html')"><span>💊</span>PHARMACY</button>
  <button onclick="location.replace('hospital.html')"><span>🏥</span>HOSPITAL</button>
