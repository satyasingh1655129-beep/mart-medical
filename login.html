<!DOCTYPE html>
<html>
<head><title>Mart Medical - Login</title><link rel="stylesheet" href="design.css"></head>
<body style="text-align:center; padding-top:100px;">
<h2>Mart Medical Login</h2>
<input type="text" id="groupid" placeholder="Group ID - MART-001"><br><br>
<input type="text" id="username" placeholder="Username"><br><br>
<input type="password" id="password" placeholder="Password"><br><br>
<button onclick="login()">Login</button>
<p id="error" style="color:red;"></p>
<script src="design.js"></script>
<script>
function login(){
  let gid = document.getElementById("groupid").value;
  let user = document.getElementById("username").value;
  let pass = document.getElementById("password").value;
  let found = USERS.find(u => u.groupId == gid && u.username == user && u.password == pass);
  if(found){
    localStorage.setItem("currentUser", found.name);
    localStorage.setItem("userRole", found.role);
    localStorage.setItem("groupId", found.groupId);
    if(found.role == "doctor") window.location.href = "doctor.html";
    if(found.role == "pharmacist") window.location.href = "pharmacist.html";
    if(found.role == "member") window.location.href = "member.html";
    if(found.role == "shop") window.location.href = "shop.html";
  } else { 
    document.getElementById("error").innerText = "Galat ID ya Password"; 
  }
}
</script>
</body>
</html>
