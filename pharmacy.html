<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pharmacy - NG Care</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#f5f5f5;padding-bottom:85px;font-size:14px}
.header{background:#0d47a1;color:white;padding:14px;text-align:center;font-weight:bold;font-size:15px}
.back-btn{position:fixed;top:8px;left:8px;z-index:99999;padding:6px 14px;border-radius:20px;border:none;background:#0d47a1;color:white;font-weight:bold;font-size:12px}
.search-wrap{margin:45px 10px 6px 10px;background:white;padding:7px 10px;border-radius:8px;display:flex;align-items:center;gap:6px;border:1px solid #ddd;height:38px}
.search-wrap label{font-size:13px;font-weight:bold;color:#0d47a1}
.search-wrap input{flex:1;border:none;outline:none;font-size:13px}
.action-row{margin:0 10px;display:flex;gap:6px}
.action-row button{flex:1;padding:7px;border:none;border-radius:6px;font-size:13px;font-weight:bold;background:white;border:1px solid #0d47a1;color:#0d47a1}
#reader{width:92%;margin:8px auto;display:none;border-radius:8px;overflow:hidden;border:1px solid #0d47a1}
.list{padding:8px;display:flex;flex-direction:column;gap:8px}
.card{background:white;padding:10px;border-radius:8px;border:1px solid #eee;font-size:13px;display:flex;justify-content:space-between;align-items:center}
.km{color:#0a9e00;font-weight:bold;font-size:11px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;justify-content:space-around;padding:5px 0;border-top:2px solid #0d47a1;z-index:9999}
.bottom-nav button{background:none;border:none;font-weight:bold;color:#0d47a1;font-size:9px;line-height:10px;flex:1;padding:6px 2px;border-radius:25px;transition:all 0.2s;white-space:nowrap}
.bottom-nav button span{font-size:18px;display:block;margin-bottom:2px}
.bottom-nav button:active,.bottom-nav button.active{background:#0d47a1;color:white;border-radius:25px}
</style>
</head>
<body>

<button class="back-btn" onclick="handleBack()">← Back</button>
<div class="header">Pharmacy Near You</div>

<div class="search-wrap">
  <label>🔍</label>
  <input id="searchAll" placeholder="Name / ID / Near Shop...">
</div>

<div class="action-row">
  <button onclick="toggleList()">📋 List</button>
  <button onclick="startScanner()">📷 Scanner</button>
</div>

<div id="reader"></div>

<!-- BAHAR WALI LIST -->
<div id="outsideList" style="display:none;margin:8px 10px;background:white;border-radius:8px;border:1px solid #000;max-height:200px;overflow:auto"></div>

<div id="medicalList" class="list"></div>

<div class="bottom-nav">
  <button onclick="goNav('index.html')"><span>🏠</span>HOME</button>
  <button class="active"><span>💊</span>PHARMACY</button>
  <button onclick="goNav('hospital.html')"><span>🏥</span>HOSPITAL</button>
  <button onclick="goNav('cart.html')"><span>🛒</span>CART</button>
</div>

<script>
let medicals = JSON.parse(localStorage.getItem('medicals'))||[];
let html5QrCode = null, scannerOn = false, listClick=0;

let STACK_KEY = 'myStack';
let CURRENT_PAGE = 'pharmacy.html';
let SKIP_PAGE = 'cart.html';
let stack = JSON.parse(sessionStorage.getItem(STACK_KEY) || '[]');
if(stack.length === 0){ stack = ['index.html']; }
if(stack[stack.length-1] !== CURRENT_PAGE){ stack.push(CURRENT_PAGE); sessionStorage.setItem(STACK_KEY, JSON.stringify(stack)); }
function goNav(page){ location.href = page; }

function handleBack(){
  if(scannerOn){ closeScanner(); return; }
  if(document.getElementById('searchAll').value!=""){ document.getElementById('searchAll').value=""; render(medicals); return; }
  stack.pop();
  let prev = stack[stack.length-1];
  while(prev === SKIP_PAGE && stack.length > 0){ stack.pop(); prev = stack[stack.length-1]; }
  sessionStorage.setItem(STACK_KEY, JSON.stringify(stack));
  if(!prev){ sessionStorage.clear(); history.back(); return; }
  location.href = prev;
}

function render(list){
  document.getElementById('medicalList').innerHTML = list.length==0 ? "<p style='text-align:center;color:#888;margin-top:15px;font-size:13px'>No Medical Found</p>" : list.map((m,i)=>`<div class="card"><div><b>${i+1}- ${m.name} [${m.id}]</b><br>${m.address||''}</div><button onclick="delM('${m.id}')" style="background:red;color:white;border:1px solid #000;border-radius:4px;padding:2px 6px;font-size:10px">✕</button></div>`).join('');
}

function toggleList(){
  listClick++;
  let out=document.getElementById('outsideList');
  let main=document.getElementById('medicalList');
  if(listClick==1){
    out.style.display='block';
    main.style.display='none';
    if(medicals.length==0){ out.innerHTML="<div style='padding:10px;font-size:12px'>Koi medical add nahi hai</div>"; return; }
    out.innerHTML=medicals.map((m,i)=>`<div style="padding:10px;border-bottom:1px solid #ddd;display:flex;justify-content:space-between">${i+1}- ${m.name} <button onclick="delM('${m.id}')" style="background:red;color:white;border:1px solid #000;border-radius:4px;padding:2px 6px;font-size:10px">✕</button></div>`).join('');
  }else{
    out.style.display='none';
    main.style.display='flex';
    listClick=0;
  }
}
function delM(id){ medicals=medicals.filter(x=>x.id!=id); localStorage.setItem('medicals',JSON.stringify(medicals)); render(medicals); document.getElementById('outsideList').style.display='none'; listClick=0; }

function startScanner(){
  let r=document.getElementById('reader'); r.style.display='block'; scannerOn=true; history.pushState({scanner:true},"","");
  html5QrCode=new Html5Qrcode("reader");
  html5QrCode.start({facingMode:"environment"},{fps:10,qrbox:200},(decoded)=>{
    document.getElementById('searchAll').value=decoded; closeScanner();
    render(medicals.filter(m=>m.id.toLowerCase()==decoded.toLowerCase()||m.name.toLowerCase().includes(decoded.toLowerCase())));
  },()=>{});
}
function closeScanner(){ if(html5QrCode){try{html5QrCode.stop();}catch(e){} html5QrCode=null;} document.getElementById('reader').style.display='none'; scannerOn=false; }
window.addEventListener('popstate',()=>{ if(scannerOn){closeScanner();return;} handleBack(); });
document.getElementById('searchAll').addEventListener('input',function(){
  let v=this.value.toLowerCase();
  let out=document.getElementById('outsideList');
  if(v){
    out.style.display='block'; document.getElementById('medicalList').style.display='none';
    let f=medicals.filter(m=>m.name.toLowerCase().includes(v)||m.id.toLowerCase().includes(v));
    out.innerHTML=f.map(m=>`<div style="padding:10px;border-bottom:1px solid #ddd;background:#fff9c4">${m.name}</div>`).join('');
  }else{ out.style.display='none'; document.getElementById('medicalList').style.display='flex'; render(medicals); }
});
render(medicals);
</script>
</body>
</html>
