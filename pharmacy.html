<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pharmacy - Final</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#f5f5f5;padding-bottom:75px}
@keyframes colorMove{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
#topShopBar{display:none;position:sticky;top:0;z-index:9999;background:linear-gradient(90deg,#ff0080,#ff8c00,#40e0d0,#0d47a1);background-size:300% 300%;animation:colorMove 4s infinite;color:white;padding:16px;text-align:center;font-weight:900;font-size:22px;text-shadow:0 2px 4px black}
.top-search{background:white;padding:12px;display:flex;gap:8px;position:sticky;top:0;z-index:9998;border-bottom:1px solid #eee}
.top-search input{flex:1;padding:13px;border-radius:25px;border:2px solid #0d47a1;outline:none;font-size:15px}
.top-search button{padding:12px 16px;border-radius:25px;border:none;background:#0d47a1;color:white;font-weight:bold}
.shop-list{display:flex;gap:8px;padding:12px;background:white;overflow-x:auto;white-space:nowrap}
.shop-list button{padding:10px 18px;border-radius:25px;border:1.5px solid #0d47a1;background:white;color:#0d47a1;font-weight:bold;flex-shrink:0}
.shop-list button.active{background:#0d47a1;color:white}
.cat-title{padding:12px 12px 0 12px;font-weight:bold;color:#0d47a1}
.cat-bar{display:flex;flex-wrap:wrap;gap:10px;padding:12px;background:white}
.cat-bar button{padding:12px 20px;border-radius:25px;border:1.5px solid #0d47a1;background:white;color:#0d47a1;font-weight:bold;font-size:14px}
.cat-bar button:active{background:#0d47a1;color:white}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;justify-content:space-around;padding:14px 0;border-top:2px solid #0d47a1;z-index:9999}
.bottom-nav a{text-decoration:none;color:#0d47a1;font-weight:bold;font-size:14px}
.bottom-nav a.active{color:#ff0080;border-bottom:2px solid #ff0080}
</style>
</head>
<body>

<!-- 1. SHOP NAME - SIRF ISI PAGE ME RAHEGA -->
<div id="topShopBar">🏪 <span id="shopNameTop"></span></div>

<!-- 2. SEARCH + NEAR LOCATION -->
<div class="top-search">
  <input id="searchBox" type="text" placeholder="🔍 Medicine search karo - Crocin, Azithro...">
  <button onclick="nearShop()">📍 Near</button>
</div>
<p id="locationMsg" style="text-align:center;font-size:13px;color:green;padding:6px"></p>

<!-- 3. SHOP SELECT -->
<div class="shop-list" id="shopList"></div>

<!-- 4. 12 CATEGORY - CLICK KARTE HI APNE LIST FILE ME JAYEGA -->
<p class="cat-title">12 Category:</p>
<div class="cat-bar" id="catBar"></div>

<!-- BOTTOM 4 BUTTON -->
<div class="bottom-nav">
  <a href="index.html">🏠 HOME</a>
  <a href="pharmacy.html" class="active">💊 PHARMACY</a>
  <a href="hospital.html">🏥 HOSPITAL</a>
  <a href="cart.html">🛒 CART</a>
</div>

<script>
// SHOP LIST
let shops=[{name:"Sharma Medical"},{name:"NG Care Lucknow"},{name:"City Pharma"},{name:"All Shop"}];
let shopDiv=document.getElementById('shopList');
shops.forEach(s=>{
  let b=document.createElement('button'); b.innerText=s.name;
  b.onclick=()=>selectShop(s.name);
  shopDiv.appendChild(b);
});

function selectShop(name){
  sessionStorage.setItem('currentShop', name);
  document.getElementById('topShopBar').style.display='block';
  document.getElementById('shopNameTop').innerText=name; // Same to Same
  document.querySelectorAll('.shop-list button').forEach(btn=>{
    if(btn.innerText==name) btn.classList.add('active'); else btn.classList.remove('active');
  });
}
let saved=sessionStorage.getItem('currentShop');
if(saved){
  document.getElementById('topShopBar').style.display='block';
  document.getElementById('shopNameTop').innerText=saved;
}

// SEARCH -> CATEGORY LIST ME REFER
document.getElementById('searchBox').addEventListener('input', function(){
  let q=this.value;
  if(q.length>=2){
    // 2 letter likhte hi search list me bhej do
    // window.location.href = `category-list.html?cat=search&q=${q}`; // Auto jana hai to ye on karo
  }
});
document.getElementById('searchBox').addEventListener('keydown', function(e){
  if(e.key==='Enter'){
    let q=this.value;
    if(q) window.location.href=`category-list.html?cat=search&q=${q}`;
  }
});

// NEAR SHOP LOCATION
function nearShop(){
  let msg=document.getElementById('locationMsg');
  msg.innerText="📍 Location le raha hai...";
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(()=>{
      msg.innerText="✅ Aapke aas-pas Sharma Medical sabse najdik hai";
      selectShop("Sharma Medical");
    },()=>{
      msg.innerText="❌ Location allow karo";
    });
  } else {
    msg.innerText="Location support nahi hai";
  }
}

// 12 CATEGORY -> APNE LIST WALE FILE ME REFER
let categories=["Tablet","Syrup","Capsule","Ointment","Tube","Lotion","Eye/Ear Drop","Family","Surgical","Injection","Drip Set","Other"];
let catBar=document.getElementById('catBar');
categories.forEach(c=>{
  let btn=document.createElement('button');
  btn.innerText=c+" ▼";
  btn.onclick=()=>{
    // CLICK KARTE HI APNE LIST FILE ME REFER
    window.location.href=`category-list.html?cat=${c}`;
  };
  catBar.appendChild(btn);
});
</script>
</body>
</html>
