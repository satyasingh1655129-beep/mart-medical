<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MART Medical Login</title>
<link rel="stylesheet" href="design.css">
<style>
.login-box{max-width:400px;margin:50px auto;padding:20px;border:1px solid #ccc;border-radius:10px;background:#fff}
.login-box h2{text-align:center}
.login-box label{display:block;margin-top:10px;font-weight:bold}
.login-box input, .login-box select, .login-box button{width:100%;padding:10px;margin-top:5px;border-radius:5px;border:1px solid #ccc}
.login-box button{background:#007bff;color:#fff;cursor:pointer;margin-top:15px}
.login-box button:hover{background:#0056b3}
#msg{text-align:center;margin-top:10px;color:green}
</style>
</head>
<body>
<div class="login-box">
    <h2>MART Medical Login</h2>

    <label>Role Select karo:</label>
    <select id="role">
        <option value="">-- Role Chuno --</option>
        <option value="Pharmacist">Pharmacist</option>
        <option value="Doctor">Doctor</option>
        <option value="Member">Member</option>
    </select>

    <label>Email:</label>
    <input type="email" id="email" placeholder="test@gmail.com">

    <button onclick="sendOTP()">Send OTP</button>

    <label>OTP Enter karo:</label>
    <input type="text" id="otp" placeholder="Yaha OTP dalo">

    <button onclick="verifyOTP()">Verify & Login</button>
    <p id="msg"></p>
</div>

<script>
let generatedOtp = "";

function sendOTP(){
    let email = document.getElementById("email").value;
    let role = document.getElementById("role").value;
    
    if(role === "" || email === ""){
        document.getElementById("msg").innerText = "Pehle Role aur Email dalo";
        document.getElementById("msg").style.color = "red";
        return;
    }
    
    generatedOtp = Math.floor(100000 + Math.random() * 900000);
    alert("Aapka OTP: " + generatedOtp); // Yaha OTP dikhega
    document.getElementById("msg").innerText = "OTP bhej diya gaya. Check alert";
    document.getElementById("msg").style.color = "green";
}

function verifyOTP(){
    let enteredOtp = document.getElementById("otp").value;
    
    if(enteredOtp === ""){
        document.getElementById("msg").innerText = "OTP dalo";
        document.getElementById("msg").style.color = "red";
        return;
    }

    if(enteredOtp == generatedOtp){
        document.getElementById("msg").innerText = "Login Success! Redirect ho rahe...";
        setTimeout(()=>{
            window.location.href = "index.html"
        }, 1500);
    } else {
        document.getElementById("msg").innerText = "Galat OTP. Fir se try karo";
        document.getElementById("msg").style.color = "red";
    }
}
</script>
</body>
</html>
