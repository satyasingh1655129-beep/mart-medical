<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NG Care</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#f5f5f5;padding-bottom:20px}
.header{background:#0d47a1;color:white;padding:12px;text-align:center}
#banner{width:100%;height:160px;background:#ddd;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:0 0 15px 15px}
#banner img{width:100%;height:100%;object-fit:cover}
.nav{display:flex;gap:10px;padding:12px;overflow-x:auto;background:white;margin-top:10px}
.nav select{padding:10px 15px;border-radius:20px;border:1px solid #0d47a1;font-weight:bold;min-width:160px}
.section{margin:15px;background:white;padding:15px;border-radius:10px}
.product-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.product{border:1px solid #eee;padding:10px;border-radius:8px;text-align:center;background:#fff}
.product img{width:100%;height:80px;object-fit:contain}
.trending{border:2px solid #ff9800}
#categoryPage{margin:15px;background:white;padding:15px;border-radius:10px}
</style>
</head>
<body>

<div class="header"><h2>NG Care</h2></div>

<!-- 1. BANNER SYSTEM -->
<div id="banner">Banner Loading...</div>

<!-- 2. CATEGORY DROPDOWN -->
<div class="nav">
<select id="categorySelect" onchange="filterCategory()">
<option value="all">All Category - Select Karo</option>
<option value="tablet">Tablet</option>
<option value="capsule">Capsule</option>
<option value="syrup">Syrup</option>
<option value="ointment">Ointment</option>
</select>
</div>

<!-- CATEGORY CLICK LIST PAGE -->
<div id="categoryPage" style="display:none;">
  <button onclick="closeCategory()" style="padding:6px 18px; background:#333; color:white; border:none; border-radius:20px;">← Back to Home</button>
  <h3 id="catTitle" style="margin-top:12px;color:#0d47a1"></h3>
  <div id="catList" class="product-grid"></div>
</div>

<!-- HOME SECTIONS -->
<div id="homeSections">
  <!-- 3. NEW PRODUCT -->
  <div class="section">
    <h3>New Product</h3>
    <div id="newProductList" class="product-grid"></div>
  </div>

  <!-- 4. TRENDING PRODUCT -->
  <div class="section">
    <h3>🔥 Trending Product</h3>
    <div id="trendingList" class="product-grid"></div>
  </div>
</div>

<script>
let products = JSON.parse(localStorage.getItem('ng_products') || '[]');
let banner = localStorage.getItem('ng_banner') || '';

// 1. Banner Load
if(banner){
  document.getElementById('banner').innerHTML = `<img src="${banner}">`;
} else {
  document.getElementById('banner').innerHTML = `<p style="color:#888">Admin Banner Yaha Lagayega</p>`;
}

// 3 & 4. Load Products
function loadProducts(){
  let newDiv = document.getElementById('newProductList');
  let trendDiv = document.getElementById('trendingList');
  newDiv.innerHTML=''; trendDiv.innerHTML='';
  
  if(products.length==0){
    newDiv.innerHTML = '<p style="color:#888">Koi product nahi, Admin se add karwaiye</p>';
    trendDiv.innerHTML = '<p style="color:#888">Koi trending nahi</p>';
    return;
  }

  products.forEach(p=>{
    let html = `<div class="product ${p.trending?'trending':''}"><img src="${p.img}"><p>${p.name}</p><small>${p.cat}</small><br><b>₹${p.price}</b></div>`;
    if(p.trending) trendDiv.innerHTML += html;
    else newDiv.innerHTML += html;
  });
}
loadProducts();

// 2. Click pe List Open
function filterCategory(){
  let cat = document.getElementById('categorySelect').value;
  if(cat=='all'){ closeCategory(); return; }
  
  document.getElementById('homeSections').style.display='none';
  document.getElementById('categoryPage').style.display='block';
  document.getElementById('catTitle').innerText = cat.toUpperCase() + ' LIST';
  let listDiv = document.getElementById('catList');
  listDiv.innerHTML='';
  
  let filtered = products.filter(p=>p.cat==cat);
  if(filtered.length==0){
    listDiv.innerHTML = `<p>Abhi ${cat} me koi product nahi hai.</p>`;
  } else {
    filtered.forEach(p=>{
      listDiv.innerHTML += `<div class="product"><img src="${p.img}"><p>${p.name}</p><b>₹${p.price}</b><br><button style="margin-top:6px; background:green; color:white; padding:6px 12px; border:none; border-radius:15px;">Add to Cart</button></div>`;
    });
  }
  window.scrollTo(0,0);
}

function closeCategory(){
  document.getElementById('categoryPage').style.display='none';
  document.getElementById('homeSections').style.display='block';
  document.getElementById('categorySelect').value='all';
}
</script>

</body>
</html>
