<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pharmacy - Mart Medical</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>body{font-family:sans-serif;background:#e3f2fd;margin:0;padding:15px}input,button{padding:12px;border-radius:8px;border:1px solid #ccc;width:100%;box-sizing:border-box;margin-top:10px}button{background:#0d47a1;color:#fff;font-weight:bold;border:none}#reader{margin-top:15px;background:#000;border-radius:10px;overflow:hidden}</style>
</head>
<body>
<h2>💊 Pharmacy Scanner</h2>
<input type="text" id="searchAll" placeholder="QR scan karo ya naam likho...">
<button onclick="startScanner()">📷 Scanner Kholo</button>
<button onclick="stopScanner()" style="background:#c62828">Scanner Band Karo</button>
<div id="reader" style="display:none;width:100%;"></div>
<div id="result" style="margin-top:15px;background:#fff;padding:10px;border-radius:10px"></div>

<script>
let html5QrCode;
async function startScanner(){
 let r=document.getElementById("reader");
 r.style.display="block";
 try{
  html5QrCode = new Html5Qrcode("reader");
  await html5QrCode.start({facingMode:"environment"}, {fps:10, qrbox:250},
   (decodedText)=>{
    document.getElementById("searchAll").value=decodedText;
    document.getElementById("result").innerHTML="✅ Scan Ho Gaya: "+decodedText;
    stopScanner();
    if(typeof searchAllData==="function") searchAllData();
   }, (err)=>{}
  );
 }catch(e){
  // Agar Permission Fail hua to Photo wala option
  r.innerHTML=`<input type="file" id="qr-file" accept="image/*" capture="environment" style="display:none"><button onclick="document.getElementById('qr-file').click()" style="padding:20px;background:#0d47a1;color:white;border:none;width:100%">📷 Photo Lo QR Ki</button>`;
  document.getElementById("qr-file").addEventListener("change", ev=>{
   if(!ev.target.files.length) return;
   const file=ev.target.files[0];
   if(!html5QrCode) html5QrCode=new Html5Qrcode("reader");
   html5QrCode.scanFile(file,true).then(t=>{
    document.getElementById("searchAll").value=t;
    document.getElementById("result").innerHTML="✅ Scan Ho Gaya: "+t;
    stopScanner();
   }).catch(()=>alert("QR saaf nahi aaya, dubara lo"));
  });
 }
}
async function stopScanner(){
 try{ if(html5QrCode){ await html5QrCode.stop(); html5QrCode.clear(); } }catch(e){}
 document.getElementById("reader").style.display="none";
 document.getElementById("reader").innerHTML="";
}
function searchAllData(){
 let v=document.getElementById("searchAll").value;
 document.getElementById("result").innerHTML="Searching: "+v;
}
</script>
</body>
</html>
