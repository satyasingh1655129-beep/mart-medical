<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pharmacy Detail</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f2f5f9;font-size:13px;padding-bottom:75px}
.header{background:#1877f2;color:white;padding:14px;text-align:center;font-weight:bold;font-size:16px;position:sticky;top:0;z-index:10}
.back{position:absolute;left:12px;top:12px;background:none;border:none;color:white;font-size:22px}
.top-card{background:white;margin:10px 12px;border-radius:14px;padding:12px;display:flex;gap:12px;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,0.06)}
.top-icon{width:52px;height:52px;background:#dbeaff;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:28px}
.name{font-weight:bold;font-size:14px}
.addr{font-size:11px;color:#666;margin-top:2px}
.meta{font-size:11px;margin-top:4px}
.badge-green{background:#c8f7c5;padding:3px 8px;border-radius:10px;font-size:10px;margin-left:6px}
.cat-row{display:flex;gap:8px;overflow-x:auto;padding:10px 12px;background:white;white-space:nowrap;border-bottom:1px solid #eee}
.cat-row::-webkit-scrollbar{display:none}
.cat-row button{border:none;padding:8px 16px;border-radius:20px;font-size:13px;font-weight:bold;background:#e9e9e9;color:#333;flex-shrink:0}
.cat-row button.active{background:#1877f2;color:white}
.search-row{display:flex;gap:6px;padding:10px 12px;background:white}
.search-box{flex:1;background:#f1f3f6;border-radius:10px;padding:9px 12px;display:flex;gap:8px;align-items:center}
.search-box input{border:none;outline:none;background:transparent;width:100%;font-size:13px}
.s-btn{border:1px solid #1877f2;background:#e8f0ff;color:#1877f2;padding:8px 12px;border-radius:10px;font-size:12px;font-weight:bold}
.sec-title{padding:14px 14px 6px 14px;display:flex;justify-content:space-between;background:#f2f5f9}
.sec-title b{font-size:14px}
.sec-title span{font-size:12px;color:#1877f2}
.prod-card{background:white;margin:8px 12px;border-radius:12px;padding:10px;display:flex;gap:10px;align-items:center;box-shadow:0 1px 4px rgba(0,0,0,0.05)}
.prod-img{width:58px;height:58px;background:#eef6ff;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0}
.prod-mid{flex:1}
.prod-mid b{font-size:13px;display:block;line-height:15px}
.prod-mid .price{font-size:14px;font-weight:bold;color:#1877f2;margin-top:4px}
.add-btn{background:#1877f2;color:white;border:none;padding:8px 14px;border-radius:10px;font-size:12px;font-weight:bold}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;justify-content:space-around;padding:8px 0 12px 0;border-top:1px solid #ddd;border-radius:16px 16px 0 0;z-index:99}
.bottom-nav a{text-decoration:none;text-align:center;font-size:11px;color:#888;font-weight:bold}
.bottom-nav a.active{color:#e91e63}
.cart-badge{background:red;color:white;font-size:9px;padding:2px 5px;border-radius:10px;position:absolute;top:-6px;right:10px}
</style>
</head>
<body>

<div class="header"><button class="back" onclick="history.back()">←</button> Pharmacy Detail</div>

<div class="top-card">
  <div class="top-icon">✚</div>
  <div>
    <div class="name">NG Care Pharmacy</div>
    <div class="addr">📍 123 Health Street, Dhaka • 2.4 km</div>
    <div class="meta">⭐ 4.5 (128 reviews) <span class="badge-green">Open • 9AM - 10PM</span></div>
  </div>
</div>

<!-- 12 Category - Quantity Hata Diya -->
<div class="cat-row" id="catRow">
  <button class="active" onclick="filterCat('ALL',this)">All Category</button>
  <button onclick="filterCat('TABLET',this)">Tablet</button>
  <button onclick="filterCat('SYRUP',this)">Syrup</button>
  <button onclick="filterCat('CAPSULE',this)">Capsule</button>
  <button onclick="filterCat('OINTMENT',this)">Ointment</button>
  <button onclick="filterCat('TUBE',this)">Tube</button>
  <button onclick="filterCat('LOTION',this)">Lotion</button>
  <button onclick="filterCat('EYE_EAR',this)">Eye/Ear Drop</button>
  <button onclick="filterCat('FAMILY',this)">Family</button>
  <button onclick="filterCat('SURGICAL',this)">Surgical</button>
  <button onclick="filterCat('INJECTION',this)">Injection</button>
  <button onclick="filterCat('DRIP',this)">Drip Set</button>
  <button onclick="filterCat('OTHER',this)">Other</button>
</div>

<div class="search-row">
  <div class="search-box">🔍 <input id="searchInput" placeholder="Search medicines..."></div>
  <button class="s-btn">Scanner</button>
  <button class="s-btn" onclick="render(medicines)">All Medicine</button>
</div>

<div id="productArea"></div>

<div class="bottom-nav">
  <a href="index.html">🏠<br>Home</a>
  <a class="active">🏪<br>Pharmacy</a>
  <a href="hospital.html">➕<br>Hospital</a>
  <a href="cart.html" style="position:relative">🛒<br>Cart <span class="cart-badge" id="cartCount">0</span></a>
</div>

<script>
function autoCategory(name){
  let n=name.toUpperCase();
  if(n.includes("TAB")) return "TABLET";
  if(n.includes("SYR")) return "SYRUP";
  if(n.includes("CAP")) return "CAPSULE";
  if(n.includes("OINT")) return "OINTMENT";
  if(n.includes("TUBE")) return "TUBE";
  if(n.includes("LOTION")) return "LOTION";
  if(n.includes("EYE") || n.includes("EAR") || n.includes("DROP")) return "EYE_EAR";
  if(n.includes("FAMILY") || n.includes("BABY")) return "FAMILY";
  if(n.includes("SURGICAL") || n.includes("BANDAGE")) return "SURGICAL";
  if(n.includes("INJ")) return "INJECTION";
  if(n.includes("DRIP") || n.includes("IV SET")) return "DRIP";
  return "OTHER";
}

let medicines = [
  {id:"M1",name:"Paracetamol 500mg",price:25},
  {id:"M2",name:"Cetirizine 10mg",price:32},
  {id:"M3",name:"Cough Syrup",price:120},
  {id:"M4",name:"ORS Syrup",price:60},
  {id:"M5",name:"Azithromycin Capsule",price:45},
  {id:"M6",name:"Betnovate Ointment",price:60},
  {id:"M7",name:"Gentamicin Injection",price:35},
  {id:"M8",name:"NS Drip Set",price:150}
].map(m=>({...m,cat:autoCategory(m.name)}));

let cart = JSON.parse(localStorage.getItem('cart'))||[];
document.getElementById('cartCount').innerText=cart.length;

function card(m){
  return `<div class="prod-card">
    <div class="prod-img">${m.cat=='TABLET'?'💊':m.cat=='SYRUP'?'🧴':'📦'}</div>
    <div class="prod-mid"><b>${m.name}</b><div class="price">Rs ${m.price}</div></div>
    <button class="add-btn" onclick="addToCart('${m.id}')">+ Add</button>
  </div>`;
}

function render(list){
  if(list.length==0){document.getElementById('productArea').innerHTML="<p style='text-align:center;padding:30px;color:#888'>No Medicine</p>";return}
  // Group by category without quantity count
  let cats = [...new Set(list.map(m=>m.cat))];
  let html="";
  cats.forEach(c=>{
    html+= `<div class="sec-title"><b>${c.replace('_','/')}</b><span>See all</span></div>`;
    html+= list.filter(m=>m.cat==c).map(m=>card(m)).join('');
  });
  document.getElementById('productArea').innerHTML=html;
}

function filterCat(cat,btn){
  document.querySelectorAll('.cat-row button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  if(cat=='ALL') render(medicines);
  else render(medicines.filter(m=>m.cat==cat));
}

function addToCart(id){
  cart.push(medicines.find(m=>m.id==id));
  localStorage.setItem('cart',JSON.stringify(cart));
  document.getElementById('cartCount').innerText=cart.length;
}

document.getElementById('searchInput').addEventListener('input',function(){
  let v=this.value.toLowerCase();
  render(medicines.filter(m=>m.name.toLowerCase().includes(v)));
});

// URL se cat aaye to filter kar do
let urlCat = new URLSearchParams(window.location.search).get('cat');
if(urlCat){ 
  setTimeout(()=>{
    let b = [...document.querySelectorAll('.cat-row button')].find(x=>x.innerText.toUpperCase().includes(urlCat));
    if(b) filterCat(urlCat,b);
  },100);
} else { render(medicines); }
</script>
</body>
</html>
