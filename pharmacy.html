<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pharmacy</title>
<link rel="stylesheet" href="style.css">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
#reader{width:94% !important;display:none;min-height:350px;background:#000;border-radius:12px;margin:10px auto;overflow:hidden;position:relative}
#reader video{width:100% !important;height:350px !important;object-fit:cover !important;display:block !important}
#reader__scan_region, #reader__dashboard, #reader div{width:100% !important;display:block !important;}
</style>
</head>
<body>

<div class="header">Pharmacy</div>
<button class="back-btn" onclick="history.back()">← Back</button>

<div class="search-wrap">
<input id="searchAll" placeholder="Name / ID / Shop..." onkeyup="searchAllData()">
</div>

<div class="action-row">
<button onclick="toggleList()">📋 List (<span id="listCount">0</span>)</button>
<button onclick="startScanner()">📷 Scanner</button>
</div>

<div id="reader"></div>
<div id="medicalList"></div>
<div id="outsideList"></div>

<div id="listPopup" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#fff;z-index:99999;padding:12px;overflow:auto;">
<h3>Saved List <button onclick="toggleList()" style="float:right">X</button></h3>
<div id="savedListView"></div>
</div>

<div class="bottom-nav">
<button onclick="location.href='index.html'"><span>🏠</span>HOME</button>
<button class="active"><span>💊</span>PHARMACY</button>
<button onclick="location.href='hospital.html'"><span>🏥</span>HOSPITAL</button>
<button onclick="location.href='cart.html'"><span>🛒</span>CART</button>
</div>

<script src="cannect.js"></script>
<script>
let selectedList = JSON.parse(localStorage.getItem("pharmaList")||"[]");
let html5QrCode = null;
let isScanning = false;
document.getElementById("listCount").innerText = selectedList.length;
let allShops = ["Board-1 A01","Board-2 A02","Board-3 A03","NG Medical Store"];
renderBoards();

function renderBoards(){
 document.getElementById("medicalList").innerHTML="<p style='text-align:center;color:#888;margin-top:20px'>Search ya Scan karo</p>";
 updateOutsideList();
}
function updateOutsideList(){
 let out=document.getElementById("outsideList");
 if(selectedList.length==0){out.innerHTML="<p style='text-align:center;color:#888;margin-top:20px'>Koi shop add nahi</p>"}
 else{out.innerHTML="<h4 style='margin:12px 12px 0'>Added Shops</h4>"+selectedList.map(id=>`<div class="board"><span>${id}</span><button onclick="deleteItem('${id}')">Delete</button></div>`).join("")}
}
function addToList(id){ if(!selectedList.includes(id)){selectedList.push(id);localStorage.setItem("pharmaList",JSON.stringify(selectedList));document.getElementById("listCount").innerText=selectedList.length;updateOutsideList();}}
function deleteItem(id){selectedList=selectedList.filter(x=>x!==id);localStorage.setItem("pharmaList",JSON.stringify(selectedList));document.getElementById("listCount").innerText=selectedList.length;updateOutsideList();}
function toggleList(){let p=document.getElementById("listPopup");p.style.display=p.style.display=="block"?"none":"block";if(p.style.display=="block")document.getElementById("savedListView").innerHTML=selectedList.map(id=>`<div class="board"><span>${id}</span><button onclick="deleteItem('${id}')">Delete</button></div>`).join("")||"Empty";}
function searchAllData(){let q=document.getElementById("searchAll").value.toLowerCase().trim();let c=document.getElementById("medicalList");if(q==""){c.innerHTML="<p style='text-align:center;color:#888;margin-top:20px'>Search ya Scan karo</p>";return}let f=allShops.filter(x=>x.toLowerCase().includes(q));c.innerHTML=f.map(x=>`<div class="board"><span>${x}</span><button onclick="addToList('${x}')">Add</button></div>`).join("");}

async function startScanner(){
 let r=document.getElementById("reader");
 r.style.display="block";
 r.innerHTML="";
 if(isScanning && html5QrCode){ try{await html5QrCode.stop();}catch(e){} }
 html5QrCode = new Html5Qrcode("reader");
 isScanning=true;
 try{
  await html5QrCode.start(
   {facingMode:"environment"},
   {fps:10, qrbox:{width:250,height:250}, aspectRatio:1.0},
   (decodedText)=>{
     document.getElementById("searchAll").value=decodedText;
     searchAllData();
     stopScanner();
     alert("Scanned: "+decodedText);
   },
   (err)=>{}
  );
 }catch(e){
  alert("Camera Error: "+e+" - https pe kholo aur Allow karo");
  r.style.display="none";
  isScanning=false;
 }
}
async function stopScanner(){
 if(html5QrCode && isScanning){
  try{await html5QrCode.stop();}catch(e){}
  isScanning=false;
 }
 document.getElementById("reader").style.display="none";
 document.getElementById("reader").innerHTML="";
}
</script>
</body>
</html>
