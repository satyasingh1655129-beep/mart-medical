<div class="navbar">
  <b>Family: <span id="groupName"></span></b> |
  <span id="menu"></span>
  <a href="#" onclick="logout()" style="float:right; color:white;">Logout</a>
</div>
<script>
let role = localStorage.getItem("userRole");
let gid = localStorage.getItem("groupId");
document.getElementById("groupName").innerText = gid;

if(role == "doctor"){ menu.innerHTML = `<a href="doctor.html">Dashboard</a> | <a href="#">Patients</a>`; }
if(role == "pharmacist"){ menu.innerHTML = `<a href="pharmacist.html">Dashboard</a> | <a href="#">Stock</a>`; }
if(role == "member"){ menu.innerHTML = `<a href="member.html">Dashboard</a> | <a href="#">My Orders</a>`; }
if(role == "service"){ menu.innerHTML = `<a href="service.html">Dashboard</a> | <a href="#">Complaints</a>`; }

function logout(){ localStorage.clear(); window.location.href = "login.html"; }
</script>
