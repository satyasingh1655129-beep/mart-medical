<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NGcare Login</title>
<style>
body{margin:0;font-family:Arial;background:linear-gradient(135deg,#6aa8ff 0%,#8ad4a0 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:15px}
.card{background:#fff;width:100%;max-width:380px;border-radius:22px;padding:22px 18px 14px 18px;box-shadow:0 15px 35px rgba(0,0,0,0.2);text-align:center}
.head{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:4px}
.icon-plus{width:38px;height:38px;background:#ff2b2b;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:28px;font-weight:900}
h1{margin:0;font-size:34px;font-weight:900;color:#0d2a7a}
.step{margin:10px 0 18px 0;font-weight:600;color:#444}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.box{border:2.5px solid;border-radius:18px;padding:16px 8px;background:#fff;cursor:pointer}
.circle{width:75px;height:75px;border-radius:50%;margin:0 auto 12px;display:flex;align-items:center;justify-content:center}
.box p{margin:0;font-weight:700;color:#333}
.member{border-color:#0bb365} .member .circle{background:#c8ecd0}
.pharma{border-color:#1a66d1} .pharma .circle{background:#d0e2ff}
.doctor{border-color:#ff8c00} .doctor .circle{background:#ffe0b2}
.service{border-color:#6a32d1} .service .circle{background:#ddd0f5}
.footer{margin-top:16px;font-size:11px;color:#888}
</style>
  <script src="ngcare-config.js"></script>
</head>
</head>
<body>
<div class="card">
<div id="mainLogo"></div>
<script>loadLogo('mainLogo')</script>
<div class="step">Step 1: Apna Role Select karo</div>
<div class="grid">
<div class="box member" onclick="goOtpWithRole('Member',this)"><div class="circle"></div>Member</div>
<div class="box pharma" onclick="goOtpWithRole('Pharmacist',this)"><div class="circle"></div>Pharmacist</div>
<div class="box doctor" onclick="goOtpWithRole('Doctor',this)"><div class="circle"></div>Doctor</div>
<div class="box service" onclick="goOtpWithRole('Help Team',this)"><div class="circle"></div>Help Team</div>
</div>
<div class="footer">You can change this later • Need help? Contact Support</div>
</div>
</body>
</html>
