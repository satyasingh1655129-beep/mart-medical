<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - NG Care</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#eef2f7;display:flex;justify-content:center;padding:0}
.phone{width:360px;max-width:100%;background:white;min-height:100vh;display:flex;flex-direction:column}
.header{background:#2e5be8;color:white;padding:14px;text-align:center;font-weight:bold;font-size:22px}
.container{padding:20px;flex:1}
.roll-title{text-align:center;font-weight:bold;font-size:28px;color:#1a2a4a;margin-top:10px}
.roll-sub{text-align:center;color:#6b7a99;font-size:15px;margin-top:4px;margin-bottom:18px}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.role-box{border:2px solid #e1e6ef;border-radius:18px;padding:18px 8px;text-align:center;cursor:pointer;background:white;transition:0.2s}
.role-box.active{border-color:#2e5be8;background:#e8efff;box-shadow:0 4px 12px rgba(46,91,232,0.2)}
.role-box .icon{font-size:42px;line-height:1}
.role-box b{display:block;margin-top:10px;font-size:17px;color:#1a2a4a}
.role-box small{display:block;font-size:12px;color:#4a5a7a;margin-top:4px;line-height:1.2}
.continue-wrap{padding:20px}
.continue{width:100%;padding:16px;background:#2e5be8;color:white;border:none;border-radius:14px;font-weight:bold;font-size:18px;cursor:pointer}
.continue:disabled{background:#aab8d8}
.note{font-size:12px;text-align:center;margin-top:12px;color:#8a99b5}
</style>
</head>
<body>
<div class="phone">
  <div class="header">NG Care</div>
  <div class="container">
    <div class="roll-title">ROLL</div>
    <div class="roll-sub">Select your role to continue</div>
    <div class="roles">
      <div class="role-box" onclick="selectRole(this,'Member')">
        <div class="icon">🧑‍🦱</div>
        <b>Member</b>
        <small>Individual account</small>
      </div>
      <div class="role-box" onclick="selectRole(this,'Pharmacist')">
        <div class="icon">💊</div>
        <b>Pharmacist</b>
        <small>Pharmacy professional</small>
      </div>
      <div class="role-box" onclick="selectRole(this,'Doctor')">
        <div class="icon">🩺</div>
        <b>Doctor</b>
        <small>Medical practitioner</small>
      </div>
      <div class="role-box" onclick="selectRole(this,'Help Team')">
        <div class="icon">🤝</div>
        <b>Help Team</b>
        <small>Support & Assistance</small>
      </div>
    </div>
  </div>
  <div class="continue-wrap">
    <button class="continue" id="btnContinue" disabled onclick="goNext()">Continue</button>
    <div class="note">You can change your role later in Settings</div>
  </div>
</div>
<script>
let selectedRole = "";
function selectRole(el, role){
  document.querySelectorAll('.role-box').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  selectedRole = role;
  document.getElementById('btnContinue').disabled = false;
}
function goNext(){
  if(!selectedRole){ alert("Pahle Role select karo"); return; }
  localStorage.setItem("role", selectedRole);
  window.location.href="otp.html";
}
</script>
</body>
</html>
