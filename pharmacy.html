<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pharmacy - NG Care</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#f5f5f5;padding-bottom:85px}
.header{background:#0d47a1;color:white;padding:14px;text-align:center;font-weight:bold;font-size:15px}
.back-btn{position:fixed;top:8px;left:8px;z-index:99999;padding:6px 14px;border-radius:20px;border:none;background:#0d47a1;color:white;font-weight:bold;font-size:12px}
.search-wrap{margin:45px 10px 6px 10px;background:white;padding:7px 10px;border-radius:8px;display:flex;align-items:center;gap:6px;border:1px solid #ddd;height:38px}
.search-wrap label{font-size:12px;font-weight:bold;color:#0d47a1}
.search-wrap input{flex:1;border:none;outline:none;font-size:12px}
.action-row{margin:0 10px;display:flex;gap:6px}
.action-row button{flex:1;padding:7px;border:none;border-radius:6px;font-size:12px;font-weight:bold;background:white;border:1px solid #0d47a1;color:#0d47a1}
#reader{width:92%;margin:8px auto;display:none;border-radius:8px;overflow:hidden;border:1px solid #0d47a1}
#locStatus{text-align:center;font-size:11px;color:#0d47a1;height:14px;margin-top:4px}
.list{padding:8px;display:flex;flex-direction:column;gap:8px}
.card{background:white;padding:10px;border-radius:8px;border:1px solid #eee;font-size:13px}
.km{color:#0a9e00;font-weight:bold;font-size:11px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;justify-content:space-around;padding:12px 0;border-top:2px solid #0d47a1;z-index:9999}
.bottom-nav button{background:none;border:none;font-weight:bold;color:#0d47a1;font-size:14px}
.bottom-nav button.active{color:#ff0080}
</style>
</head>
<body>

<button class="back-btn" onclick="goBack()">← Back</button>
<div class="header">Pharmacy Near You</div>

<div class="search-wrap">
  <label>🔍</label>
  <input id="searchAll" placeholder="Name / ID / Near Shop...">
</div>

<div class="action-row">
  <button onclick="startScanner()">📷 Scanner</button>
  <button onclick="getNearLocation()">📍 Near Location</button>
</div>

<div id="reader"></div>
<div id="locStatus"></div>
<div id="medicalList" class="list"></div>

<div class="bottom-nav">
  <button onclick="location.href='index.html'">🏠 HOME</button>
  <button class="active">💊 PHARMACY</button>
  <button onclick="location.href='hospital.html'">🏥 HOSPITAL</button>
  <button onclick="location.href='cart.html'">🛒 CART</button>
</div>

<script>
let medicals = JSON.parse(localStorage.getItem('medicals'))||[];
let html5QrCode = null;
let scannerOn = false;

function render(list){
  list.sort((a,b)=>a.km-b.km);
  document.getElementById('medicalList').innerHTML = list.length==0 ? "<p style='text-align:center;color:#888;margin-top:15px;font-size:12px'>No Medical Found</p>" : list.map(m=>`<div class="card" onclick="location.href='medical-detail.html?id=${m.id}'"><b>${m.name} [${m.id}]</b><br><span class="km">📍 ${m.km} KM</span> - ${m.address}</div>`).join('');
}

function startScanner(){
  let r = document.getElementById('reader');
  r.style.display='block';
  scannerOn = true;
  history.pushState({scanner:true}, "", "");
  html5QrCode = new Html5Qrcode("reader");
  html5QrCode.start({facingMode:"environment"}, {fps:10, qrbox:200},
    (decoded)=>{
      document.getElementById('searchAll').value=decoded;
      closeScanner();
      render(medicals.filter(m=>m.id.toLowerCase()==decoded.toLowerCase()||m.name.toLowerCase().includes(decoded.toLowerCase())));
    },()=>{});
}

function closeScanner(){
  if(html5QrCode){ try{ html5QrCode.stop(); }catch(e){} }
  document.getElementById('reader').style.display='none';
  scannerOn = false;
  document.getElementById('locStatus').innerText="";
}

// Back - Scanner band, usi page me raho
function goBack(){
  if(scannerOn){
    closeScanner();
    return;
  }
  if(document.getElementById('searchAll').value!=""){
    document.getElementById('searchAll').value="";
    render(medicals);
    return;
  }
  // Home me nahi jayega, usi me rahega
}

window.addEventListener('popstate', ()=>{
  if(scannerOn){ closeScanner(); }
});

document.getElementById('searchAll').addEventListener('input', function(){
  let v=this.value.toLowerCase();
  render(medicals.filter(m=>m.name.toLowerCase().includes(v)||m.id.toLowerCase().includes(v)||m.address.toLowerCase().includes(v)));
});

function getNearLocation(){
  document.getElementById('locStatus').innerText="📍 Location le raha hu...";
  navigator.geolocation.getCurrentPosition(p=>{
    let lat1=p.coords.latitude, lon1=p.coords.longitude;
    medicals.forEach(m=>{ if(m.lat&&m.lon){ let d=6371*Math.acos(Math.cos(lat1*Math.PI/180)*Math.cos(m.lat*Math.PI/180)*Math.cos((m.lon-lon1)*Math.PI/180)+Math.sin(lat1*Math.PI/180)*Math.sin(m.lat*Math.PI/180)); m.km=d.toFixed(1); } });
    document.getElementById('locStatus').innerText="✅ Near sort done";
    render(medicals);
  },()=>{ document.getElementById('locStatus').innerText="❌ Allow location"; });
}

render(medicals);
history.replaceState({page:"list"}, "", "");
history.pushState({page:"list"}, "", "");
</script>
</body>
</html>
