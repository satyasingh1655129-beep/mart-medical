<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{background:#eef0f4;font-family:Arial;margin:0;padding:15px;display:flex;justify-content:center}
.card{background:#fff;width:360px;padding:20px;border-radius:20px}
h2{text-align:center;color:#0f1f4a;margin:0}
.sub{text-align:center;color:#888;margin:5px 0 20px}
.box{display:flex;align-items:center;background:#dbeaff;border-radius:15px;margin-bottom:12px;padding:12px;border:3px solid;cursor:pointer}
.ico{width:50px;height:50px;background:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:28px;margin-right:12px}
.btn{width:100%;padding:14px;background:#0f1f4a;color:#fff;border:none;border-radius:12px;font-size:17px;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
<div class="card">
<h2>NG CARE Login</h2>
<div class="sub">Select an option to continue</div>

<div class="box" style="border-color:#ff8c00" onclick="window.location.href='otp.html'"><div class="ico">🧑</div><b>Member</b></div>
<div class="box" style="border-color:#00b050" onclick="window.location.href='otp.html'"><div class="ico">💊</div><b>Pharmacist</b></div>
<div class="box" style="border-color:#0b62d6" onclick="window.location.href='otp.html'"><div class="ico">🩺</div><b>Doctor</b></div>
<div class="box" style="border-color:#6a11f5" onclick="window.location.href='otp.html'"><div class="ico">🤝</div><b>Help Team</b></div>

<button class="btn" onclick="window.location.href='otp.html'">Continue</button>
</div>
</body>
</html>
