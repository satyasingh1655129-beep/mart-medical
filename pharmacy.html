<div id="reader" style="width:100%;display:none;"></div>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
let qr;
function startScanner(){
 document.getElementById("reader").style.display="block";
 qr = new Html5Qrcode("reader");
 qr.start({facingMode:"environment"}, {fps:10, qrbox:{width:250,height:250}},
  (text)=>{
   document.getElementById("searchAll").value=text;
   document.getElementById("result").innerText="Scan: "+text;
   stopScanner();
  },
  (err)=>{}
 ).catch(e=>{ alert("Camera Allow karo: "+e); });
}
function stopScanner(){
 if(qr){ qr.stop().then(()=>qr.clear()); }
 document.getElementById("reader").style.display="none";
}
</script>
