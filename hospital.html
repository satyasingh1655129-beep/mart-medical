<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hospital</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#f5f5f5;padding-bottom:85px;font-size:14px}
.header{background:#0d47a1;color:white;padding:14px;text-align:center;font-weight:bold;font-size:15px;position:relative}
.save-top{position:absolute;right:10px;top:10px;background:white;color:#0d47a1;border:none;padding:5px 12px;border-radius:15px;font-weight:bold;font-size:11px}
.back-btn{position:fixed;top:8px;left:8px;z-index:99999;padding:6px 14px;border-radius:20px;border:none;background:#0d47a1;color:white;font-weight:bold;font-size:12px}
.search-wrap{margin:45px 10px 6px 10px;background:white;padding:7px 10px;border-radius:8px;display:flex;align-items:center;gap:6px;border:1px solid #ddd;height:38px}
.search-wrap input{flex:1;border:none;outline:none;font-size:13px}
.action-row{margin:0 10px;display:flex;gap:6px}
.action-row button{flex:1;padding:7px;border:1px solid #0d47a1;background:white;color:#0d47a1;border-radius:6px;font-weight:bold}
#reader{width:92%;margin:8px auto;display:none;border-radius:8px;border:1px solid #0d47a1;overflow:hidden}
.list{padding:8px;display:flex;flex-direction:column;gap:8px}
.card{background:white;padding:10px;border-radius:8px;border:1px solid #eee}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;justify-content:space-around;padding:5px 0;border-top:2px solid #0d47a1}
.bottom-nav button{background:none;border:none;color:#0d47a1;font-weight:bold;font-size:9px;flex:1;padding:6px 2px;border-radius:25px}
.bottom-nav button span{font-size:18px;display:block}
.bottom-nav button.active{background:#0d47a1;color:white}
.save-box{display:none;position:fixed;top:50px;left:10px;right:10px;background:white;padding:12px;border-radius:10px;border:2px solid #0d47a1;z-index:10000}
.save-box input{width:100%;padding:7px;margin:4px 0;border:1px solid #ccc;border-radius:5px}
.save-box button{width:100%;padding:8px;background:#0d47a1;color:white;border:none;border-radius:5px;margin-top:6px;font-weight:bold}
</style>
</head>
<body>
<button class="back-btn" onclick="handleBack()">← Back</button>
<div class="header">Hospital <button class="save-top" onclick="openSave()">+ SAVE</button></div>
<div class="save-box" id="saveBox"><b>Hospital Save Karo</b><input id="s_id" placeholder="ID"><input id="s_name" placeholder="Name"><input id="s_addr" placeholder="Address"><button onclick="saveHospital()">Save</button><button onclick="closeSave()" style="background:#888">Band</button></div>
<div class="search-wrap">🔍 <input id="searchAll" placeholder="Search..."></div>
<div class="action-row"><button onclick="startScanner()">📷 Scanner</button></div>
<div id="reader"></div>
<div id="hospitalList" class="list"></div>
<div class="bottom-nav">
<button onclick="goNav('index.html')"><span>🏠</span>HOME</button>
<button onclick="goNav('pharmacy.html')"><span>💊</span>PHARMACY</button>
<button class="active"><span>🏥</span>HOSPITAL</button>
<button onclick="goNav('cart.html')"><span>🛒</span>CART</button>
</div>
<script>
let hospitals=JSON.parse(localStorage.getItem('hospitals'))||[];
let html5QrCode=null,scannerOn=false,lastBack=0;
function goNav(p){ location.replace(p); }
function handleBack(){
 if(document.getElementById('saveBox').style.display=='block'){closeSave();return}
 if(scannerOn){closeScanner();return}
 if(document.getElementById('searchAll').value!=""){document.getElementById('searchAll').value="";render(hospitals);return}
 let now=Date.now(); if(now-lastBack<2000){history.go(-history.length); setTimeout(()=>window.close(),100)} else{lastBack=now}
}
function openSave(){document.getElementById('saveBox').style.display='block'}
function closeSave(){document.getElementById('saveBox').style.display='none'}
function saveHospital(){let id=s_id.value.trim(),name=s_name.value.trim(),addr=s_addr.value.trim(); if(!id||!name){alert('ID Name likho');return} hospitals.push({id,name,address:addr}); localStorage.setItem('hospitals',JSON.stringify(hospitals)); s_id.value="";s_name.value="";s_addr.value=""; closeSave(); render(hospitals)}
function render(list){hospitalList.innerHTML=list.length==0?"<p style='text-align:center;color:#888;margin-top:15px'>No Data</p>":list.map(m=>`<div class="card"><b>${m.name} [${m.id}]</b><br>${m.address}</div>`).join('')}
function startScanner(){reader.style.display='block';scannerOn=true; html5QrCode=new Html5Qrcode("reader"); html5QrCode.start({facingMode:"environment"},{fps:10,qrbox:200},d=>{searchAll.value=d; closeScanner(); render(hospitals.filter(m=>m.id==d||m.name.toLowerCase().includes(d.toLowerCase())))},()=>{})}
function closeScanner(){if(html5QrCode){try{html5QrCode.stop()}catch(e){} html5QrCode=null} reader.style.display='none'; scannerOn=false}
searchAll.addEventListener('input',function(){let v=this.value.toLowerCase(); render(hospitals.filter(m=>m.name.toLowerCase().includes(v)||m.id.toLowerCase().includes(v)))});
render(hospitals);
</script>
</body>
</html>
